services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:1.0
    container_name: mariadb
    env_file: .env
    networks: [inception_network]
    volumes: [mariadb_data:/var/lib/mysql]
    restart: always

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:1.0
    container_name: wordpress
    env_file: .env
    depends_on: [mariadb]
    networks: [inception_network]
    volumes: [wordpress_data:/var/www/wordpress]
    restart: always

  nginx:
    build: ./requirements/nginx
    image: nginx:1.0
    container_name: nginx
    env_file: .env
    depends_on: [wordpress]
    ports: ["443:443"]
    networks: [inception_network]
    volumes: [wordpress_data:/var/www/wordpress]
    restart: always

networks:
  inception_network:
    driver: bridge


volumes:
  wordpress_data:
    driver_opts:
      type: none
      o: bind
      device: /home/abnemili/data/wordpress
  mariadb_data:
    driver_opts:
      type: none
      o: bind
      device: /home/abnemili/data/mariadb
